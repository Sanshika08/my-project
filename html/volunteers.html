<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteers</title>

    <!-- ✅ Navbar CSS -->
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/home_screen.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../css/volunteers.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- 🌅 Fade In -->
    <script>
        window.addEventListener("load", () => {
            document.body.classList.add("fade-in");
        });
    </script>

    <!-- ✅ REUSABLE NAVBAR -->
    <div id="navbarContainer"></div>

    <!-- ✅ PAGE CONTENT -->
    <div id="pageContainer" class="page-container">

        <div class="main">

            <!-- 🔥 TOP SECTION -->
            <div class="vol-top">

                <div class="vol-left">
                    <h2 class="page-title">Volunteers List</h2>

                    <input type="text" id="volSearch" placeholder="Search by name or phone..."
                        onkeyup="searchVolunteers()">
                </div>

                <div class="vol-right">
                    <button class="add-vol-btn" onclick="navigatePage('add_volunteer.html')">
                        + Add Volunteer
                    </button>
                </div>

            </div>

            <!-- 🔥 STATS -->
            <div class="vol-stats">

                <div class="stat-box">
                    <h3 id="totalVol">0</h3>
                    <p>Total Volunteers</p>
                </div>

                <div class="stat-box green">
                    <h3 id="activeVol">0</h3>
                    <p>Active</p>
                </div>

                <div class="stat-box gray">
                    <h3 id="inactiveVol">0</h3>
                    <p>Inactive</p>
                </div>

            </div>


            <!-- 🏆 LEADERBOARD SECTION -->
            <div class="leaderboard-section">

                <h3 class="leaderboard-title">🏆 Top Performers</h3>

                <!-- 🔥 TOP 3 CARDS -->
                <div class="top-performers" id="topPerformers">

                    <!-- SAMPLE (JS will replace) -->
                    <!--
        <div class="top-card">
            <div class="rank-badge">🥇</div>
            <div class="top-avatar">R</div>
            <div class="top-name">Ritesh</div>
            <div class="top-stats">
                Assigned: 15 | Resolved: 12
            </div>
        </div>
        -->

                </div>

                <!-- 📊 LEADERBOARD TABLE -->
                <div class="leaderboard-table">

                    <!-- HEADER -->
                    <div class="leaderboard-header">
                        <span>Name</span>
                        <span>Assigned</span>
                        <span>Resolved</span>
                        <span>Success %</span>
                    </div>

                    <!-- DATA ROWS -->
                    <div id="leaderboardBody">
                        <!-- JS will inject rows -->
                    </div>

                </div>

            </div>

            <div id="loader" class="loader-container">
                <div class="spinner"></div>
            </div>

            <div class="vol-container" id="volunteerTable">
                <!-- Data from JS -->
            </div>

        </div>

    </div>

    <!-- ✅ NAVBAR SCRIPT -->
    <script type="module" src="../js/navbar.js"></script>
    <script type="module">
        import "../js/navbar.js";

        window.addEventListener("DOMContentLoaded", () => {
            window.loadNavbar();
        });
    </script>

    <!-- Page JS -->
    <script type="module" src="../js/volunteers.js"></script>

</body>

</html>
