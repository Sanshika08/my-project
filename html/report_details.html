<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Details</title>

    <link rel="stylesheet" href="../css/report_details.css">

</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-logo">
            <img src="../image/SARRS_circle_logo_removebg.png" alt="SARRS Logo">
        </div>

        <a href="home_screen.html">🏠 Home</a>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="report_details.html" class="report_active">📄 Report Details</a>

    </div>


    <!-- MAIN CONTENT -->
    <div class="main">

        <div class="card">

            <div class="header">
                <div class="title-section">
                    <h2>Report Details</h2>
                    <span class="status" id="statusBadge">Pending</span>
                </div>
            </div>


            <div class="image-container">

                <div id="imageLoader" class="image-loader"></div>

                <img id="animalImage" class="report-image" style="display:none;">

            </div>


            <div class="details">

                <div class="detail-box">
                    <b>Report ID:</b>
                    <span id="reportId"></span>
                </div>

                <div class="detail-box">
                    <b>Animal Type:</b>
                    <span id="animalType"></span>
                </div>

                <div class="detail-box">
                    <b>Case Type:</b>
                    <span id="caseType"></span>
                </div>

                <div class="detail-box">
                    <b>Reported Date:</b>
                    <span id="reportDate"></span>
                </div>

                <div class="detail-box">
                    <b>Reported:</b>
                    <span id="reportTimeAgo"></span>
                </div>

                <div class="detail-box">
                    <b>Location:</b>
                    <span id="location"></span>

                    <!-- ACTION BUTTONS -->
                    <div class="location-actions">
                        <button onclick="openMaps()">📍 Open Map</button>
                        <button onclick="shareLocation()">📤 Share Location</button>
                        <button onclick="copyLocation()">📋 Copy Location</button>
                    </div>
                </div>

                <div class="detail-box full">
                    <b>Description:</b>
                    <span id="description"></span>
                </div>

            </div>

            <div class="assign-container">

                <div class="assign-grid">

                    <!-- LEFT TITLE -->
                    <h3 class="assign-title">Assign Volunteer</h3>

                    <!-- RIGHT TITLE -->
                    <div class="assign-label">
                        <b>Assigned To:</b>
                    </div>

                    <!-- LEFT CONTROLS -->
                    <div class="assign-row">

                        <select id="volunteerSelect" class="volunteer-dropdown">
                            <option value="" disabled selected>-- Select Volunteer --</option>
                        </select>

                        <button class="assign-btn" onclick="assignVolunteer()">
                            Assign
                        </button>

                    </div>

                    <!-- RIGHT STATUS -->
                    <div class="assigned-box">

                        <span id="assignedVolunteer">Not Assigned</span>

                        <button class="view-volunteer-btn" onclick="viewVolunteer()">
                            View
                        </button>

                    </div>

                </div>

            </div>

            <div class="actions">

                <button id="resolveBtn" class="approve" onclick="toggleStatus()" disabled>
                    ✔ Mark as Resolved
                </button>
                <p id="resolveWarning" class="resolve-warning">
                    ⚠ Assign a volunteer before resolving this report
                </p>

                <button class="delete" onclick="deleteReport()">
                    🗑 Delete
                </button>

                <button class="back" onclick="goBack()">
                    ← Back
                </button>

                <button id="shareBtn" onclick="shareWithVolunteer()" class="btn btn-success" disabled>
                    📤 Share with Volunteer
                </button>



            </div>

        </div>
    </div>

    <script type="module" src="../js/report_details.js"></script>

</body>

</html>
