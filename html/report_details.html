<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Report</title>

    <link rel="stylesheet" href="/css/report_details.css">
</head>

<body>

    <div class="sidebar">

        <div class="sidebar-logo">
            <img src="../image/SARRS_circle_logo_removebg.png" alt="error">
        </div>

        <a href="home_screen.html" class="drawer-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>

        <a href="dashboard.html" class="drawer-item">
            <span class="icon">📊</span>
            <span>Dashboard</span>
        </a>

        <a href="report_details.html" class="report-item active">
            <span class="icon">📄</span>
            <span>Report Details</span>
        </a>
    </div>

    <div class="main">
        <div class="card">

            <h2>Report Details <span class="status" id="statusBadge">Pending</span></h2>

            <div class="details">
                <div class="detail-box">ID: </div>
                <div class="detail-box">Animal Type: </div>
                <div class="detail-box">CaseType: </div>
                <div class="detail-box">Condition:</div>
                <div class="detail-box">Location: </div>
                <div class="detail-box">Date: </div>
                <div class="detail-box">Image: </div>
                <div class="detail-box">Status: </div>
                <div class="detail-box">Description: </div>

                <div class="actions">
                    <button class="action approve" onclick="approve()">Toggle Status</button>
                    <button class="action delete" onclick="deleteReport()">Delete</button>
                    <button class="action back" onclick="goBack()">Back</button>
                </div>

                <div class="spinner" id="spinner"></div>

            </div>
        </div>
        <script type="module" src="../js/report_details.js"></script>
</body>

</html>
