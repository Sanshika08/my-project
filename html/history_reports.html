<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Reports | SARRS</title>

    <!-- ✅ Navbar CSS -->
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/home_screen.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../css/history_reports.css">

</head>

<body>

    <!-- 🌅 Fade In -->
    <script>
        window.addEventListener("load", () => {
            document.body.classList.add("fade-in");
        });
    </script>

    <!-- ✅ REUSABLE NAVBAR -->
    <div id="navbarContainer"></div>

    <!-- ✅ PAGE CONTAINER -->
    <div id="pageContainer" class="page-container">

        <div class="container">

            <h2>📜 Report History</h2>

            <div class="search-box">
                <input type="text" id="searchInput"
                    placeholder="Search reports by animal, location, volunteer..."
                    onkeyup="searchReports()">
            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Animal Info</th>
                            <th>Location</th>
                            <th>Reported</th>
                            <th>Resolved</th>
                            <th>Volunteer</th>
                            <th>Details</th>
                        </tr>
                    </thead>

                    <tbody id="historyTable">

                        <tr id="noDataRow">
                            <td colspan="9" style="text-align:center;">
                                No resolved reports found
                            </td>
                        </tr>

                    </tbody>

                </table>

                <div id="loader" class="loader-container">
                    <div class="spinner"></div>
                    <p>Loading reports...</p>
                </div>

            </div>

        </div>

    </div>

     <div id="footerContainer"></div>

    <!-- ✅ NAVBAR LOAD -->
    <script type="module">
        import "../js/navbar.js";
        import { loadFooter } from "../js/footer.js";

        window.addEventListener("DOMContentLoaded", () => {
            window.loadNavbar();
            loadFooter();
            
        });
    </script>

    <!-- Page JS -->
    <script type="module" src="../js/history_reports.js"></script>

</body>

</html>
