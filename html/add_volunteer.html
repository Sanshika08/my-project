<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Volunteer</title>

    <!-- ✅ Navbar CSS -->
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/home_screen.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="../css/add_volunteers.css">
</head>

<body>

    <!-- 🌅 Fade In -->
    <script>
        window.addEventListener("load", () => {
            document.body.classList.add("fade-in");
        });
    </script>

    <!-- ✅ REUSABLE NAVBAR -->
    <div id="navbarContainer"></div>

    <!-- ✅ PAGE CONTAINER -->
    <div id="pageContainer" class="page-container">

        <div class="main">

            <div class="card">

                <!-- HEADER -->
                <div class="form-header">
                    <h2>Add Volunteer</h2>
                    <p>Register a new volunteer or rescue team member</p>
                </div>

                <div class="form-divider"></div>
                
                <div class="profile-preview">

                    <div class="avatar-preview" id="avatarPreview">R</div>

                    <div class="preview-info">
                        <div class="preview-name" id="previewName">Volunteer Name</div>
                        <div class="preview-role" id="previewRole">Role</div>
                    </div>

                </div>

                <!-- FORM GRID -->
                <div class="form-grid">

                    <!-- NAME -->
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="volName" placeholder="Enter volunteer name">
                    </div>

                    <!-- PHONE -->
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="volPhone" placeholder="Enter phone number">
                    </div>

                    <!-- ROLE (UPDATED → SELECT) -->
                    <div class="form-group">
                        <label>Role</label>
                        <select id="volRole">
                            <option value="">Select role</option>
                            <option value="Volunteer">Volunteer</option>
                            <option value="Rescue Team">Rescue Team</option>
                        </select>
                    </div>

                </div>

                <!-- STATUS -->
                <div class="form-group status-group">
                    <label>Status</label>

                    <div class="status-toggle">
                        <span>Inactive</span>

                        <label class="switch">
                            <input type="checkbox" id="volStatus" checked>
                            <span class="slider"></span>
                        </label>

                        <span>Active</span>
                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="form-actions">
                    <button class="vol-add-btn" onclick="addVolunteer()">
                        + Add Volunteer
                    </button>

                    <button class="vol-cancel-btn" onclick="history.back()">
                        Cancel
                    </button>
                </div>

                <!-- SUCCESS MESSAGE -->
                <p id="successMsg"></p>

            </div>

        </div>

    </div>

    <!-- ✅ NAVBAR LOAD -->
    <script type="module">
        import "../js/navbar.js";

        window.addEventListener("DOMContentLoaded", () => {
            window.loadNavbar();
        });
    </script>

    <!-- Page JS -->
    <script type="module" src="../js/add_volunteer.js"></script>

</body>

</html>
