<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Volunteer</title>

    <link rel="stylesheet" href="../css/add_volunteers.css">

</head>

<body>


    <!-- DRAWER / SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-logo">
            <img src="../image/SARRS_circle_logo_removebg.png" alt="SARRS Logo">
        </div>

        <a href="home_screen.html">🏠 Home</a>

        <a href="volunteers.html">👥 Volunteers</a>

        <a href="add_volunteer.html" class="active">➕ Add Volunteer</a>
        <a href="history_reports.html">📜 History Reports</a>

    </div>



    <!-- MAIN CONTENT -->
    <div class="main">

        <div class="card">

            <h2>Add Volunteer</h2>


            <div class="form-row">

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="volName" placeholder="Enter volunteer name">
                </div>

                <div class="input-group">
                    <label>Phone</label>
                    <input type="text" id="volPhone" placeholder="Enter phone number">
                </div>

                <div class="input-group">
                    <label>Role</label>
                    <input type="text" id="volRole" placeholder="Volunteer / Rescue Team">
                </div>

            </div>


            <button class="add-btn" onclick="addVolunteer()">
                Add Volunteer
            </button>


            <p id="successMsg"></p>

        </div>

    </div>


    <script type="module" src="../js/add_volunteer.js"></script>

</body>

</html>
